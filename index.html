<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Socrarius Memory Archive</title>
    <style>
        body {
            background: rgba(0, 5, 15, 0.9);
            color: #e0f7ff;
            font-family: 'Consolas', monospace;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        /* 🌸 上部固定バナー */
        .system-banner {
            position: fixed;
            top: 0; left: 0; width: 100%;
            height: 40px;
            background: rgba(0, 105, 217, 0.3);
            border-bottom: 1px solid #00f2fe;
            display: flex;
            align-items: center;
            padding-left: 20px;
            font-size: 14px;
            letter-spacing: 2px;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        /* 🌸 セクションタイトル（追加） */
        .section-title {
            background: #000;
            color: #00f2fe;
            padding: 8px 15px;
            margin: 20px 0 15px 0;
            font-size: 11px;
            font-weight: bold;
            border-left: 4px solid #00f2fe;
            letter-spacing: 2px;
            box-shadow: inset 0 0 10px rgba(0, 242, 254, 0.2);
        }

        /* 🌸 アルバムグリッド（従来サイズ） */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 5px;
            margin-top: 10px;
        }

        /* 🌸 ランチャーグリッド（ミニマルサイズ） */
        .launcher-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 12px;
            margin-bottom: 40px;
        }

        /* ===============================================
        =========🌸 ステータス表示エリア（ここが重要！）==========
        ================================================== */
        .status-container {
            position: relative; /* ボタンの配置基準にする */
            width: fit-content;
            margin-bottom: 20px;
        }

        .memory-card {
            border: 1px solid rgba(0, 242, 254, 0.3);
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            transition: 0.3s;
            display: block;
            text-decoration: none;
        }

        /* ランチャー用カードの調整 */
        .launcher-card {
            padding: 5px;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }

        .memory-card:hover {
            border-color: #00f2fe;
            /* 外側に広がる青い光（グロー効果） */
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.6), 
                        inset 0 0 10px rgba(0, 242, 254, 0.4);
            transform: scale(1.02);
            background: rgba(0, 242, 254, 0.1); /* ほんのり背景も青く */
            cursor: pointer;
        }

        .launcher-card:hover {
            transform: scale(1.2); /* アイコンは強調 */
            z-index: 10;
        }

        .memory-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 2px;
        }

        /* 画像自体にも少し変化を出すとさらに綺麗です */
        .memory-card:hover img {
            filter: brightness(1.2); /* 少し明るくする */
            transition: 0.3s;
        }

        .launcher-card img {
            height: 100%;
            object-fit: contain;
        }

        /*=================================
        ===== 🌸 切り替えボタンの配置 ========
        ===================================*/
        .status-btn {
            position: absolute;
            top: 260px; /* 上からの位置 */
            width: 26px;
            height: 113px;
            cursor: pointer;
            z-index: 10;
            transition: 0.2s;
            filter: drop-shadow(0 0 5px rgba(0, 242, 254, 0.5));
        }

        .status-btn:hover {
            filter: brightness(1.5) drop-shadow(0 0 10px #00f2fe);
            transform: scale(1.05);
        }

        #btn-prev { left: 15px; } /* 左ボタン */
        #btn-next { right: 15px; } /* 右ボタン */

        }


        /* カスタムスクロールバー */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #345485; }
    </style>
</head>
<body>

    <div class="system-banner">
        USER SETTINGS & CONFIDENEIAL DATA
    </div>
    <br>
     <div class="section-title">USER SETTINGS PROFILE</div>
    <!-- アルバムセクション -->
    <div class="gallery">
    <img src="https://socrarius-tool.com/my/button2.png" id="btn-prev" class="status-btn" alt="Prev">
    <img src="https://socrarius-tool.com/my/button1.png" id="btn-next" class="status-btn" alt="Next">
        <div class="memory-card">
            <a href="https://onedrive.live.com/personal/8efd2a634dbe3220/_layouts/15/doc.aspx?resid=3d8cbfd0-3fa0-4694-9854-022a8f135c10&cid=8efd2a634dbe3220" target="_blank" rel="noopener" >
            <img src="https://socrarius-tool.com/my/my1.png" id="status-image" alt="Memory 1"></div>
        </a>

    </div>

    <!-- 🌸 PHOTO STORAGE LINK ランチャーセクション -->
    <div class="section-title">CONFIDENEIAL DATAK</div>
    <div class="launcher-grid">
        <a href="https://one.google.com/storage?g1_landing_page=1" target="_blank" rel="noopener" class="memory-card launcher-card">
            <img src="https://socrarius-tool.com/my/icon1.png" alt="Google Photos">
        </a>
        <a href="https://onedrive.live.com/?view=1" target="_blank" rel="noopener" class="memory-card launcher-card">
            <img src="https://socrarius-tool.com/my/icon2.png" alt="iCloud Photos">
        </a>
        <a href="https://www.icloud.com/" target="_blank" rel="noopener" class="memory-card launcher-card">
            <img src="https://socrarius-tool.com/my/icon3.png" alt="Amazon Photos">
        </a>
        <a href="https://www.amazon.co.jp/photos/" target="_blank" rel="noopener" class="memory-card launcher-card">
            <img src="https://socrarius-tool.com/my/icon5.png" alt="Amazon Photos">
        </a>
        <a href="https://keep.google.com/" target="_blank" rel="noopener" class="memory-card launcher-card">
            <img src="https://socrarius-tool.com/my/icon6.png" alt="Amazon Photos">
        </a>
        <a href="https://secure.freee.co.jp/" target="_blank" rel="noopener" class="memory-card launcher-card">
            <img src="https://socrarius-tool.com/my/icon7.png" alt="Amazon Photos">
        </a>

    </div>

    <script>
        const images = [
            "https://socrarius-tool.com/my/my1.png",
            "https://socrarius-tool.com/my/my2.png",
            "https://socrarius-tool.com/my/my5.png",
            "https://socrarius-tool.com/my/my3.png",
            "https://socrarius-tool.com/my/my6.png",
            "https://socrarius-tool.com/my/my7.png",
            "https://socrarius-tool.com/my/my8.png",
            "https://socrarius-tool.com/my/my9.png",
            "https://socrarius-tool.com/my/my4.png"
        ];
        let currentIndex = 0;
        const statusImg = document.getElementById('status-image');

        document.getElementById('btn-next').onclick = () => {
            currentIndex = (currentIndex + 1) % images.length;
            statusImg.src = images[currentIndex];
        };

        document.getElementById('btn-prev').onclick = () => {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            statusImg.src = images[currentIndex];
        };
    </script>

</body>
</html>
